education:
  degree: B.Tech Computer Science
  school: Your University
  graduation_year: "2025"

preferences:
  remote: "Yes"
  relocation: "Yes"
  travel: "Occasionally"

# Reusable free-text answers. Keys are for you; the model matches by meaning.
answers:
  why_this_role: One or two sentences about why this kind of role fits.
  about_me: A short, factual self-introduction.
  strengths: Two or three concrete strengths.

# Optional: job-specific extras. Ignored for non-job goals.
job:
